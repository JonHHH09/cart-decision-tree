services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cart_decision_tree
      POSTGRES_USER: cart
      POSTGRES_PASSWORD: cart
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart -d cart_decision_tree"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
