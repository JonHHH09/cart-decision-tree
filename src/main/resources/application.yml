server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: cart-decision-tree
  ai:
    mcp:
      server:
        name: cart-decision-tree
        version: ${APP_VERSION:0.1.0-SNAPSHOT}
        protocol: STREAMABLE
        instructions: Train, inspect, predict with, and evaluate the seeded CART fruit classifier.
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/cart_decision_tree
    username: cart
    password: cart
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
