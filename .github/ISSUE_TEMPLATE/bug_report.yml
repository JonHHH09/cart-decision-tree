name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here; use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Release or commit
      placeholder: v0.1.0 or full commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and remove credentials, personal data, and private paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: This is not a security vulnerability.
          required: true
        - label: The report contains no secrets or personal data.
          required: true
