name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jonhhh09/cart-decision-tree

jobs:
  verify:
    name: Verify promotion and artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_number: ${{ steps.version.outputs.version_number }}
      publish: ${{ steps.guard.outputs.publish }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out exact main head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify trusted promotion
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            promotion_head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[] | select(.state == "closed" and .merged_at != null and .base.ref == "main" and .head.ref == "development" and .head.repo.full_name == env.GITHUB_REPOSITORY and .merge_commit_sha == env.GITHUB_SHA)] | if length == 1 then .[0].head.sha else empty end')
            test -n "$promotion_head"
            git merge-base --is-ancestor "$promotion_head" HEAD
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Select next immutable version
        id: version
        run: |
          set -euo pipefail
          version=''
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
            [[ -z "$version" ]] || { echo 'multiple SemVer tags point at this commit' >&2; exit 1; }
            version=$tag
          done < <(git tag --points-at HEAD)
          if [[ -z "$version" ]]; then
            latest=''
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                latest=$tag
                break
              fi
            done < <(git tag --list 'v*' --sort=-v:refname)
            if [[ -z "$latest" ]]; then
              version=v0.1.0
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              version="v${major}.${minor}.$((patch + 1))"
            fi
            if git rev-parse --verify --quiet "refs/tags/${version}"; then
              echo "next version already exists: $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_number=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Run exact-head release gate
        run: |
          python3 scripts/verify_repository.py
          python3 scripts/publication_audit.py --history
          ./gradlew --no-daemon clean check bootJar -PreleaseVersion=${{ steps.version.outputs.version_number }}
      - name: Stage versioned release artifact
        run: |
          mkdir -p build/release
          cp build/libs/cart-decision-tree-${{ steps.version.outputs.version_number }}.jar \
            build/release/cart-decision-tree-${{ steps.version.outputs.version_number }}.jar
          (cd build/release && sha256sum cart-decision-tree-${{ steps.version.outputs.version_number }}.jar > SHA256SUMS)
      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-application
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  candidate:
    name: Candidate ${{ matrix.arch }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out exact main head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-application
          path: build/release-download
      - name: Stage exact JAR for image build
        run: |
          (cd build/release-download && sha256sum --check SHA256SUMS)
          mkdir -p build/release
          cp build/release-download/cart-decision-tree-${{ needs.verify.outputs.version_number }}.jar \
            build/release/cart-decision-tree.jar
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build exact platform candidate
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --load \
            --build-arg VERSION=${{ needs.verify.outputs.version_number }} \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag cart-decision-tree:candidate-${{ matrix.arch }} .
          docker image inspect cart-decision-tree:candidate-${{ matrix.arch }} --format '{{.Id}}' \
            > IMAGE-ID-${{ matrix.arch }}
          test "$(docker image inspect cart-decision-tree:candidate-${{ matrix.arch }} --format '{{.Config.User}}')" = app
      - name: Smoke exact platform candidate
        env:
          CART_IMAGE: cart-decision-tree:candidate-${{ matrix.arch }}
          COMPOSE_PROJECT_NAME: release-${{ matrix.arch }}
          POSTGRES_PASSWORD: synthetic-release-password
        run: |
          docker compose -f compose.release.yaml up --detach --wait --wait-timeout 240
          curl --fail --silent --show-error http://127.0.0.1:8081/actuator/health/readiness
          test "$(docker inspect release-${{ matrix.arch }}-app-1 --format '{{.HostConfig.ReadonlyRootfs}}')" = true
      - name: Generate platform SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: cart-decision-tree:candidate-${{ matrix.arch }}
          format: spdx-json
          output-file: SBOM-${{ matrix.arch }}.spdx.json
      - name: Export exact smoke-tested candidate
        run: docker save cart-decision-tree:candidate-${{ matrix.arch }} | gzip -9 > candidate-${{ matrix.arch }}.tar.gz
      - name: Upload exact platform candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-${{ matrix.arch }}
          path: |
            candidate-${{ matrix.arch }}.tar.gz
            IMAGE-ID-${{ matrix.arch }}
            SBOM-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove smoke environment
        if: always()
        env:
          CART_IMAGE: cart-decision-tree:candidate-${{ matrix.arch }}
          COMPOSE_PROJECT_NAME: release-${{ matrix.arch }}
          POSTGRES_PASSWORD: synthetic-release-password
        run: docker compose -f compose.release.yaml down --volumes --remove-orphans

  publish:
    name: Publish release and GHCR index
    needs: [verify, candidate]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out exact main head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*"
          path: release-inputs
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push exact platform candidates
        id: platforms
        run: |
          set -euo pipefail
          refs=()
          : > IMAGE-DIGESTS
          for arch in amd64 arm64; do
            gunzip -c "release-inputs/candidate-${arch}.tar.gz" | docker load
            actual=$(docker image inspect "cart-decision-tree:candidate-${arch}" --format '{{.Id}}')
            expected=$(cat "release-inputs/IMAGE-ID-${arch}")
            test "$actual" = "$expected"
            platform_ref="${IMAGE}:sha-${GITHUB_SHA}-${arch}"
            docker tag "cart-decision-tree:candidate-${arch}" "$platform_ref"
            if ! docker buildx imagetools inspect "$platform_ref" >/dev/null 2>&1; then
              docker push "$platform_ref"
            fi
            digest=$(docker buildx imagetools inspect "$platform_ref" --format '{{json .Manifest.Digest}}' | tr -d '"')
            registry_config=$(docker buildx imagetools inspect --raw "${platform_ref}@${digest}" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["config"]["digest"])')
            test "$actual" = "$registry_config"
            printf '%s %s\n' "$arch" "$digest" >> IMAGE-DIGESTS
            refs+=("${platform_ref}@${digest}")
          done
          sha_index_ref="${IMAGE}:sha-${GITHUB_SHA}"
          if docker buildx imagetools inspect "$sha_index_ref" >/dev/null 2>&1; then
            docker buildx imagetools inspect --raw "$sha_index_ref" \
              | python3 -c 'import json, pathlib, sys; data=json.load(sys.stdin); actual=sorted(item["digest"] for item in data["manifests"]); expected=sorted(line.split()[1] for line in pathlib.Path("IMAGE-DIGESTS").read_text().splitlines()); assert actual == expected, (actual, expected)'
          else
            docker buildx imagetools create --tag "$sha_index_ref" "${refs[@]}"
          fi
          index_digest=$(docker buildx imagetools inspect "$sha_index_ref" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$index_digest"
          version_ref="${IMAGE}:${{ needs.verify.outputs.version }}"
          if docker buildx imagetools inspect "$version_ref" >/dev/null 2>&1; then
            version_digest=$(docker buildx imagetools inspect "$version_ref" --format '{{json .Manifest.Digest}}' | tr -d '"')
            test "$version_digest" = "$index_digest"
          else
            docker buildx imagetools create --tag "$version_ref" "${IMAGE}@${index_digest}"
          fi
          docker buildx imagetools inspect --raw "${IMAGE}@${index_digest}" \
            | python3 -c 'import json, sys; data=json.load(sys.stdin); actual={(item["platform"]["os"], item["platform"]["architecture"]) for item in data["manifests"]}; expected={("linux", "amd64"), ("linux", "arm64")}; assert actual == expected, (actual, expected)'
          echo "index_digest=$index_digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}:${{ needs.verify.outputs.version }}"
      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Sign immutable image index
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.platforms.outputs.index_digest }}"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${{ steps.platforms.outputs.index_digest }}"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.platforms.outputs.index_digest }}
          push-to-registry: true
      - name: Attest application artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-inputs/cart-decision-tree-${{ needs.verify.outputs.version_number }}.jar
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          version=${{ needs.verify.outputs.version }}
          if git rev-parse --verify --quiet "refs/tags/${version}"; then
            test "$(git rev-list -n 1 "$version")" = "$GITHUB_SHA"
          else
            git tag --annotate "$version" --message "Release $version"
            git push origin "refs/tags/${version}"
          fi
          cp IMAGE-DIGESTS release-inputs/IMAGE-DIGESTS
          printf 'amd64 %s\narm64 %s\n' \
            "$(cat release-inputs/IMAGE-ID-amd64)" \
            "$(cat release-inputs/IMAGE-ID-arm64)" > release-inputs/IMAGE-IDS
          printf '%s@%s\n' "$IMAGE" "${{ steps.platforms.outputs.index_digest }}" > release-inputs/IMAGE-INDEX
          (cd release-inputs && sha256sum \
            cart-decision-tree-${{ needs.verify.outputs.version_number }}.jar \
            SBOM-amd64.spdx.json SBOM-arm64.spdx.json IMAGE-DIGESTS IMAGE-IDS IMAGE-INDEX \
            > SHA256SUMS)
          assets=(
            "release-inputs/cart-decision-tree-${{ needs.verify.outputs.version_number }}.jar"
            release-inputs/SHA256SUMS
            release-inputs/SBOM-amd64.spdx.json
            release-inputs/SBOM-arm64.spdx.json
            release-inputs/IMAGE-DIGESTS
            release-inputs/IMAGE-IDS
            release-inputs/IMAGE-INDEX
          )
          if gh release view "$version" >/dev/null 2>&1; then
            existing=$(mktemp -d)
            gh release download "$version" --dir "$existing" || true
            mapfile -t remote_names < <(gh release view "$version" --json assets --jq '.assets[].name')
            for remote_name in "${remote_names[@]}"; do
              known=false
              for asset in "${assets[@]}"; do [[ "$remote_name" == "${asset##*/}" ]] && known=true; done
              [[ "$known" == true ]] || { echo "unexpected existing release asset: $remote_name" >&2; exit 1; }
            done
            for asset in "${assets[@]}"; do
              name=${asset##*/}
              if [[ -f "$existing/$name" ]]; then
                cmp -s "$asset" "$existing/$name"
              else
                gh release upload "$version" "$asset"
              fi
            done
          else
            gh release create "$version" "${assets[@]}" \
              --verify-tag --generate-notes --title "$version"
          fi
      - name: Update latest after immutable release completion
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:latest" \
            "${IMAGE}@${{ steps.platforms.outputs.index_digest }}"
          latest_digest=$(docker buildx imagetools inspect "${IMAGE}:latest" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          test "$latest_digest" = "${{ steps.platforms.outputs.index_digest }}"
